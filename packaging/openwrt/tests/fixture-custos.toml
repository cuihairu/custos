version = 1

# OpenWrt itself
[[resources]]
id = "wan"
type = "network-interface"

[resources.probe]
interface = "eth0"
interval_ms = 10000

# Default gateway
[[resources]]
id = "gateway"
type = "default-gateway"

[resources.probe]
interval_ms = 10000

# the dnsmasq process
[[resources]]
id = "dnsmasq"
type = "custom-command"

[resources.probe]
command = ["sh", "-c", "pidof dnsmasq | grep -q . && echo OK || exit 1"]
interval_ms = 10000

# Gateway reachability
[[resources]]
id = "lan-host"
type = "icmp"

[resources.probe]
host = "192.168.5.1"
timeout_ms = 3000
interval_ms = 10000
