# OpenClash failover — google/github unreachable through the proxy →
# switch the router's OpenClash group to the best measured node, then
# restart the service as the second plan (the 2026-11-15 real scenario).
#
# Chain of responsibility (each resource answers one question):
#   wan      — is the physical line up? If not, dependent recovery is
#              suppressed: switching proxy nodes cannot fix a dead WAN and
#              would only churn the group.
#   openclash— is the clash core's external controller serving? This
#              resource is served by the openclash PLUGIN (not a builtin
#              probe): [[plugins]] declares the process, the resource
#              references it with `plugin` + `probe_operation`.
#   google / github — is traffic actually flowing THROUGH the proxy?
#              Builtin proxy probes (absolute-form GET via the mixed port).
#              Their recovery plans dispatch plugin operations
#              (`plugin` + `operation_id`), no shell scripts involved.
#
# The plugin itself filters subscription info members (remaining traffic /
# plan expiry / provider site …) out of node selection — they carry healthy
# delays but are not
# proxies (2026-11-15 fix, plugins/clash-api).
#
# Deploy: build the plugin, copy it next to the custos binary on the router
# (iStoreOS), fill in the CHANGE_ME values, then
#   custos validate examples/openclash-failover.toml && custos start ...
version = 1

# Recovery actions below dispatch plugin operations; none of them touch the
# local shell. `restart` is gated separately (high risk).
[permissions]
default_allow_high_risk = false

# The plugin process (docs/guide/plugins.md §5.1/§5.4): spawned lazily by the
# host, speaks the `custos/v1` stdio protocol, and receives a CLEAN
# environment plus exactly these entries — credentials reach the plugin
# explicitly instead of through host inheritance.
[[plugins]]
name = "openclash"
# CHANGE_ME: path of the built plugin binary
# (cargo build -p custos-openclash-plugin --release →
#  target/release/openclash-plugin).
binary = "/usr/local/bin/openclash-plugin"
request_timeout_ms = 10000

[plugins.env]
# CHANGE_ME: external controller of the OpenClash core. On the router
# itself the default loopback works; from a LAN box use the router address.
OPENCLASH_API = "http://127.0.0.1:9090"
# CHANGE_ME: controller secret (`uci get openclash.config.dashboard_password`).
OPENCLASH_SECRET = "CHANGE_ME"
# CHANGE_ME: the selector group to manage (e.g. the subscription's main node group).
OPENCLASH_GROUP = "CHANGE_ME"

# --- the physical line -------------------------------------------------------
[[resources]]
id = "wan"
type = "network-connectivity"
display_name = "WAN (public DNS anchor)"

[resources.probe]
host = "223.5.5.5"
port = 53
timeout_ms = 3000

[resources.health_policy]
failure_threshold = 3
success_threshold = 2

# No recovery plans here — deliberately. WAN repair is operator work (see
# examples/network-outage.toml for the platform-specific argv form); this
# resource's job is detection: while `wan` is unhealthy, recovery of the
# dependent resources is suppressed, so a dead line never causes proxy-node
# churn (switching nodes cannot fix a physical outage).

# --- the clash core (plugin-served probe) ------------------------------------
[[resources]]
id = "openclash"
type = "openclash"
display_name = "OpenClash 核心控制器"
depends_on = ["wan"]

# The probe comes from the plugin's `probe_provider` capability instead of
# a builtin probe; `probe_operation` names which one (default "probe").
plugin = "openclash"
probe_operation = "openclash.probe"

[resources.health_policy]
failure_threshold = 3
success_threshold = 2

# Controller unreachable → the API path is dead (switching through it
# cannot work) → restart the OpenClash service via the init script.
# interrupts_network + interrupts_remote_admin ⇒ HIGH RISK: this plan only
# runs because the resource opts in below.
[resources.recovery_policy]
allow_high_risk = true

[[resources.recovery_policy.plans]]
plan_id = "restart-openclash"
applicable_faults = ["probe_timeout", "plugin_unavailable"]
risk = "high"
idempotent = true
timeout_ms = 60000
max_attempts = 2
cooldown_ms = 120000

[resources.recovery_policy.plans.action]
plugin = "openclash"
operation_id = "openclash.restart"

[resources.recovery_policy.plans.verification]
status_is = "healthy"

# --- traffic through the proxy -----------------------------------------------
[[resources]]
id = "google"
type = "proxy"
display_name = "google.com 经代理可达性"
depends_on = ["wan", "openclash"]

[resources.probe]
# CHANGE_ME: OpenClash mixed port. On the router itself 127.0.0.1:7890;
# from a LAN box use the router address, e.g. 192.168.5.11:7890.
proxy = "127.0.0.1:7890"
# The builtin proxy probe speaks absolute-form HTTP; https:// targets need
# CONNECT support, so anchor on the 204 endpoint over http://.
target = "http://www.gstatic.com/generate_204"
timeout_ms = 5000

[resources.health_policy]
failure_threshold = 3
success_threshold = 2

# Plan 1 (ordered recovery): diagnose + switch to the best REAL node.
# Measured delays come from one /group/{group}/delay query; subscription
# info members are filtered by the plugin. 407 (auth) deliberately has NO
# plan — switching nodes cannot fix wrong credentials.
[[resources.recovery_policy.plans]]
plan_id = "switch-best-node"
applicable_faults = ["proxy_connection_failed", "remote_endpoint_unreachable"]
risk = "low"
idempotent = false
timeout_ms = 15000
max_attempts = 3
cooldown_ms = 30000

[resources.recovery_policy.plans.action]
plugin = "openclash"
operation_id = "openclash.switch_best_node"

[resources.recovery_policy.plans.verification]
status_is = "healthy"

[[resources]]
id = "github"
type = "proxy"
display_name = "github.com 经代理可达性"
depends_on = ["wan", "openclash"]

[resources.probe]
proxy = "127.0.0.1:7890"
target = "http://github.com"
timeout_ms = 5000

[resources.health_policy]
failure_threshold = 3
success_threshold = 2

[[resources.recovery_policy.plans]]
plan_id = "switch-best-node"
applicable_faults = ["proxy_connection_failed", "remote_endpoint_unreachable"]
risk = "low"
idempotent = false
timeout_ms = 15000
max_attempts = 3
cooldown_ms = 30000

[resources.recovery_policy.plans.action]
plugin = "openclash"
operation_id = "openclash.switch_best_node"

[resources.recovery_policy.plans.verification]
status_is = "healthy"
