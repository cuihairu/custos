# Notification wiring example (docs/guide/notification.md §8).
#
# The `[notification]` section is independent from recovery rules: recovery
# policy decides *how to fix*, notification rules decide *who hears about it*.
# Local log is the always-on base audit; webhook and SMTP are remote channels.
version = 1

[[resources]]
id = "web"
type = "http-endpoint"
display_name = "public web entry"

[resources.probe]
command = ["sh", "-c", "curl -fsS -o /dev/null http://127.0.0.1:8080/healthz"]

[resources.health_policy]
failure_threshold = 3
success_threshold = 2

[[resources.recovery_policy.plans]]
plan_id = "restart-httpd"
applicable_faults = ["remote_endpoint_unreachable", "probe_timeout"]
risk = "medium"
timeout_ms = 10000
max_attempts = 2
cooldown_ms = 30000

[resources.recovery_policy.plans.action]
program = "sh"
args = ["-c", "systemctl restart httpd || service httpd restart"]

[resources.recovery_policy.plans.verification]
status_is = "healthy"

# Alert ops whenever recovery is exhausted or an outcome is unknown.
[[notification.rules]]
id = "alert-recovery-trouble"
event = "recovery.exhausted"
severity_min = "warning"
channels = ["ops-webhook", "herald-alerts"]
log = true

[[notification.rules]]
id = "alert-outcome-unknown"
event = "recovery.outcome_unknown"
severity_min = "warning"
channels = ["ops-webhook", "herald-alerts"]
log = true

# Unhealthy resources always hit the local audit log too.
[[notification.rules]]
id = "audit-unhealthy"
event = "resource.unhealthy"
severity_min = "critical"
channels = []
log = true

[notification.channels.ops-webhook]
type = "webhook"
url = "https://ops.example.com/custos/hook"
timeout_ms = 5000
retries = 3
backoff_ms = 30000
headers = { Authorization = "Bearer CHANGE_ME" }
hmac_secret = "CHANGE_ME"
tls_verify = true

[notification.channels.ops-webhook.ssrf]
block_private = true
block_loopback = true
block_redirects = true

[notification.channels.audit]
type = "local-log"
enabled = true

# Herald (github.com/cuihairu/herald) app integration: custos dispatches to
# the app API with severity→urgency mapping, fault events as state=down and
# recovery.succeeded as state=ok, so herald-side dedup collapses repeats and
# a state flip resends.
[notification.channels.herald-alerts]
type = "herald"
base_url = "http://127.0.0.1:8080"
app = "custos"
token = "CHANGE_ME_trigger_scope"
auth = "api-key"        # or "bearer"
category = "alerts"
audiences = ["log"]     # bare channel names, "user:<id>", "group:<id>"
