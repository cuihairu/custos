# Notification wiring example.
#
# NOTE: notification channel configuration lands with P1
# (docs/guide/roadmap.md P1 item 10); this file shows the resource side that
# P1 channels will subscribe to. Local log notification is always on.
version = 1

[[resources]]
id = "web"
type = "http-endpoint"
display_name = "public web entry"

[resources.probe]
command = ["sh", "-c", "curl -fsS -o /dev/null http://127.0.0.1:8080/healthz"]

[resources.health_policy]
failure_threshold = 3
success_threshold = 2

# Recovery exhaustion will emit recovery.exhausted (critical) once P1
# channels are configured; until then it lands in the local structured log.
[[resources.recovery_policy.plans]]
plan_id = "restart-httpd"
applicable_faults = ["remote_endpoint_unreachable", "probe_timeout"]
risk = "medium"
timeout_ms = 10000
max_attempts = 2
cooldown_ms = 30000

[resources.recovery_policy.plans.action]
program = "sh"
args = ["-c", "systemctl restart httpd || service httpd restart"]

[resources.recovery_policy.plans.verification]
status_is = "healthy"
