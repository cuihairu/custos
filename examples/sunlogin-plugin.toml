# Sunlogin (Sunflower/AweSun) supervision via the sunlogin PLUGIN — wrapping a
# closed-source client that offers no official API.
#
# Health model (verified live on AweSun 16.5 / Windows, 2026-11-16):
# the 16.x client's loopback listeners are GUI↔service private IPC — the
# legacy HTTP status surface is GONE. Observable layers instead:
#   1. service RUNNING            (`sc query AweSunService` / systemctl)
#   2. client processes alive     (AweSun.exe, awesun_guard.exe / sunloginclient)
#   3. cloud session ESTABLISHED  (client pid → :443) — THE health signal:
#                                  the machine is remotely controllable now
#   4. config.ini facts           (full_version, account = binding)
# Old 11.x-era installs still answer `/cgi-bin/rpc?action=login-type` on a
# loopback port; point SUNLOGIN_API/SUNLOGIN_PORT at it for extra facts
# (optional, non-fatal).
#
# Ladder: probe unhealthy (names the failing layer) → restart the client
# service → verify. Restarting a remote-access client kills live remote
# sessions — the capability declares interrupts_remote_admin. Account
# re-login is declared but pending real-machine UI-automation work; it must
# stay behind allow_high_risk.
version = 1

[permissions]
default_allow_high_risk = false

[[plugins]]
name = "sunlogin"
# CHANGE_ME: path of the built plugin binary
# (cargo build -p custos-sunlogin-plugin --release →
#  target/release/sunlogin-plugin).
binary = "/usr/local/bin/sunlogin-plugin"
request_timeout_ms = 10000

[plugins.env]
# Service/unit managing the client. This PINS exactly one candidate — no
# fallbacks (a wrong fallback would be restarted by the plan!). Find it with
# `systemctl list-units | grep -i -e sunlogin -e awesun` (Linux) or
# `sc query AweSunService` (Windows). Default: sunloginclient / AweSunService.
SUNLOGIN_SERVICE = "sunloginclient"
# Optional client config.ini override (version/binding facts). Default paths:
#   Windows  C:\Program Files\Oray\AweSun\config.ini (16.x)
#            C:\ProgramData\Oray\SunloginClient\config.ini (11.x)
#   Linux    /usr/local/sunlogin/config.ini
# SUNLOGIN_CONFIG = "C:\\Program Files\\Oray\\AweSun\\config.ini"
# Optional LEGACY (11.x-era) loopback status surface, e.g. discovered via
# client logs. 16.x installs don't answer it — leave unset there.
# SUNLOGIN_API = "http://127.0.0.1:49181"
# SUNLOGIN_PORT = "49181"

[[resources]]
id = "sunlogin"
type = "sunlogin"
display_name = "向日葵远控客户端"
plugin = "sunlogin"
probe_operation = "sunlogin.probe"

[resources.health_policy]
failure_threshold = 3
success_threshold = 2

# Any failing layer (service down / client dead / cloud session lost) →
# restart the service. NOTE: restarting a remote-access client kills live
# remote sessions; the capability declares interrupts_remote_admin — risk
# "medium" and verify gates it. Plugin-probe faults map to unknown_failure /
# probe_timeout.
[[resources.recovery_policy.plans]]
plan_id = "restart-sunlogin"
applicable_faults = ["unknown_failure", "probe_timeout"]
risk = "medium"
idempotent = true
timeout_ms = 60000
max_attempts = 2
cooldown_ms = 120000

[resources.recovery_policy.plans.action]
plugin = "sunlogin"
operation_id = "sunlogin.restart"

[resources.recovery_policy.plans.verification]
status_is = "healthy"

# Account re-login (UI automation) is declared but NOT implemented yet.
# Once it lands on a verified Windows host, add it here as the LAST plan,
# high risk, behind an explicit allow_high_risk opt-in:
#
# [resources.recovery_policy]
# allow_high_risk = true
#
# [[resources.recovery_policy.plans]]
# plan_id = "relogin-oray-account"
# applicable_faults = ["unknown_failure"]
# risk = "high"
# idempotent = false
# timeout_ms = 120000
# max_attempts = 1
# cooldown_ms = 600000
#
# [resources.recovery_policy.plans.action]
# plugin = "sunlogin"
# operation_id = "sunlogin.relogin"
#
# [resources.recovery_policy.plans.verification]
# status_is = "healthy"
