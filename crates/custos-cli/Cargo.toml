[package]
name = "custos-cli"
description = "Cross-platform local self-healing engine (CLI)"
authors = ["cuihairu <chuihairu@gmail.com>"]
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "custos"
path = "src/main.rs"

[build-dependencies]
# Embeds assets/icons/custos.ico into the exe resource section (see build.rs).
# Unconditional (build.rs compiles for the host on every target); the code is
# host-gated so non-Windows hosts never reference the crate.
winresource = "0.1"

# RPM packaging (cargo-generate-rpm): the built binary at /usr/bin/custos.
# cargo-generate-rpm requires this section; the asset source is resolved
# against the cargo target directory (which honors --target for the matrix).
[package.metadata.generate-rpm]
assets = [
    # The built binary lives at the workspace target directory (two levels
    # up from this package). cargo-generate-rpm resolves asset sources
    # relative to the package root.
    { source = "../../target/release/custos", dest = "/usr/bin/custos", mode = "0755" },
]

[dependencies]
custos-config = { workspace = true }
custos-model = { workspace = true }
custos-core = { path = "../custos-core" }
custos-engine = { path = "../custos-engine" }
custos-probe = { path = "../custos-probe" }
custos-store = { path = "../custos-store" }
custos-notify = { path = "../custos-notify" }
custos-dashboard = { path = "../custos-dashboard" }
serde_json = { workspace = true }
tracing = "0.1"
