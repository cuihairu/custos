[package]
name = "custos-notify"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
custos-config = { path = "../custos-config" }
custos-model = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = "0.1"
ureq = "3"
hmac = "0.12"
sha2 = "0.10"
url = "2"
lettre = { version = "0.11", default-features = false, features = [
    "smtp-transport",
    "builder",
    "hostname",
    "rustls-tls",
] }

[dev-dependencies]
tracing-subscriber = "0.3"
