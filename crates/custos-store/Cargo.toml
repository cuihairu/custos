[package]
name = "custos-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
custos-engine = { workspace = true }
custos-model = { workspace = true }
custos-notify = { path = "../custos-notify" }
# sqlx 0.9's sqlite feature turns on sqlite-bundled, which compiles SQLite
# from source: builds stay hermetic on every OS (no system libsqlite3 or
# vcpkg needed). The old explicit libsqlite3-sys/bundled declaration is
# redundant since that change (cargo machete adjudication, 2026-11-26).
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = "0.1"
tokio = { workspace = true }

[dev-dependencies]
tempfile = "3"
