[package]
name = "custos-tray"
version.workspace = true
edition.workspace = true
license.workspace = true

# Desktop tray companion (docs/guide/dashboard-cli-config.md §9.3): reads
# the engine's SQLite store and shows a system tray / menu-bar icon. The
# engine (`custos start`) stays headless; the tray is a separate process
# that runs its event loop on the main thread (required by macOS NSStatusItem).
[dependencies]
custos-model = { workspace = true }
custos-store = { path = "../custos-store" }
custos-config = { path = "../custos-config" }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = "0.1"
tracing-subscriber = "0.3"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.26"
muda = "0.21"

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = "0.26"
muda = "0.21"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication"] }
objc2-foundation = "0.3"
objc2-core-foundation = { version = "0.3", features = ["CFDate"] }

[dev-dependencies]
tempfile = "3"
