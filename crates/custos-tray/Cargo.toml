[package]
name = "custos-tray"
version.workspace = true
edition.workspace = true
license.workspace = true

# Desktop tray companion (docs/guide/dashboard-cli-config.md §9.3): reads
# the engine's SQLite store and shows a system tray / menu-bar icon. The
# engine (`custos start`) stays headless; the tray is a separate process
# that runs its event loop on the main thread (required by macOS NSStatusItem).
[dependencies]
custos-model = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = "0.1"
tracing-subscriber = "0.3"
# File logging for the windowed Windows release (no console on stdout).
tracing-appender = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
# The tray is a windows/macos companion: the engine-store read path compiles
# only where the tray runs (main.rs `run` is cfg-gated). Declaring the dep
# here instead of unconditionally keeps `cargo::unused_dependencies` quiet on
# Linux, where the tray never builds its store reader.
custos-store = { path = "../custos-store" }
tray-icon = "0.26"
muda = "0.21"
# MessageBoxW for the "both log dirs unwritable" user-visible signal (the
# windowed release has no console; a silent io::sink would be undiagnosable).
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
# Embeds assets/icons/custos.ico into the exe resource section (see build.rs).
# Unconditional (build.rs compiles for the host on every target); the code is
# host-gated so non-Windows hosts never reference the crate.
winresource = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
custos-store = { path = "../custos-store" }
tray-icon = "0.26"
muda = "0.21"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication"] }
objc2-foundation = "0.3"
objc2-core-foundation = { version = "0.3", features = ["CFDate"] }

[dev-dependencies]
tempfile = "3"
