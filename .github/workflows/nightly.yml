# Nightly rolling build (user ruling 2026-10-11: 每日构建属正常交付面).
#
#   Linux   : deb + rpm + tar.gz binary  (x86_64, aarch64)
#   Windows : msi + zip binary           (x86_64)
#   macOS   : dmg + tar.gz binary        (aarch64)
#
# This is NOT a formal release: no version tag is created, nothing is
# promoted to a versioned Release. Binaries publish to the rolling `nightly`
# prerelease ONLY after fmt + clippy + the full workspace test suite pass.
# Scheduled runs skip when main has no commits in the last 48h.
name: nightly

on:
  schedule:
    - cron: "57 4 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  # Never cancel: the macOS runner is a limited resource and queued
  # jobs would be cancelled by the next trigger; let the queue wait.
  cancel-in-progress: false

jobs:
  # Gate: freshness (scheduled only) + fmt + clippy + full test suite.
  check:
    runs-on: ubuntu-latest
    outputs:
      fresh: ${{ steps.fresh.outputs.fresh }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: fresh
        name: skip when main is quiet for 48h (scheduled runs)
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ -z "$(git log -1 --since='48 hours ago' --format=%H origin/main)" ]; then
              echo "fresh=false" >> "$GITHUB_OUTPUT"
              echo "no commits on main in 48h; skipping nightly"
            else
              echo "fresh=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@stable
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace

  build:
    needs: check
    if: needs.check.outputs.fresh == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: custos-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: custos-linux-aarch64
          # musl: fully static, runs on OpenWrt/iStoreOS, Alpine, and any libc
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            artifact: custos-linux-musl-x86_64
            static: true
            install_musl_tools: true

          - os: windows-2022
            target: x86_64-pc-windows-msvc
            artifact: custos-windows-x86_64
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: custos-macos-aarch64
    runs-on: ${{ matrix.os }}
    env:
      CC_x86_64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: install musl toolchain
        if: matrix.static
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
      - name: build release binary
        run: >
          cargo build --release
          --target ${{ matrix.target }}
          --bin custos --bin custos-tray

      # Binary location: target/<target>/release/custos (workspace root).

      # Linux: deb + rpm + binary tarball.
      - name: package deb
        if: runner.os == 'Linux' && !matrix.static
        run: |
          cargo install cargo-deb
          cargo deb --no-strip -p custos-cli --target "${{ matrix.target }}"
          mkdir -p dist
          cp "target/${{ matrix.target }}/debian"/*.deb dist/
      - name: package rpm
        if: runner.os == 'Linux' && !matrix.static
        working-directory: crates/custos-cli
        run: |
          cargo install cargo-generate-rpm
          # Stage the matrix-triple binary at the fixed asset path: the RPM
          # asset source is a literal path and cannot express --target.
          cp "${{ github.workspace }}/target/${{ matrix.target }}/release/custos" \
             "${{ github.workspace }}/target/release/custos"
          cargo generate-rpm --target "${{ matrix.target }}" --auto-req disabled
          mkdir -p "${{ github.workspace }}/dist"
          cp target/${{ matrix.target }}/generate-rpm/*.rpm \
             "${{ github.workspace }}/dist/" || cp target/generate-rpm/*.rpm \
             "${{ github.workspace }}/dist/"
      - name: package binary tarball
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          tar -C "target/${{ matrix.target }}/release" -czf "dist/${{ matrix.artifact }}.tar.gz" custos custos-tray

      # OpenWrt .ipk: musl static binary + procd init + LuCI interface
      # (packaging/openwrt/build-ipk.sh; the tar.gz wrapper format
      # installs via `opkg install custos*.ipk`).
      - name: package openwrt ipk
        if: runner.os == 'Linux' && matrix.static
        run: |
          sh packaging/openwrt/build-ipk.sh "target/${{ matrix.target }}/release/custos" dist/
          ARCH=$(echo ${{ matrix.target }} | sed 's/unknown-linux-musl//;s/-//g')
          mv "dist/custos_0.1.0-1_x86_64.ipk" "dist/custos_0.1.0-1_${ARCH}.ipk" 2>/dev/null \
            || echo "ipk rename skipped"

      # Windows: zip binary + msi.
      - name: package binary zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "target/${{ matrix.target }}/release/custos.exe","target/${{ matrix.target }}/release/custos-tray.exe" -DestinationPath "dist/${{ matrix.artifact }}.zip"
      - name: package msi
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo install cargo-wix
          # cargo-wix resolves the .wxs Source paths relative to the package
          # directory (crates/custos-cli), so stage the built binaries into
          # crates/custos-cli/target/release (not the workspace target).
          $stage = "crates/custos-cli/target/release"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/custos.exe" -Destination "$stage/custos.exe" -Force
          Copy-Item "target/${{ matrix.target }}/release/custos-tray.exe" -Destination "$stage/custos-tray.exe" -Force
          # Replace the Product Version attribute whatever its current value
          # (the old literal '0.1.0' replacement silently no-ops if the wxs
          # ever carries another version string).
          $ver = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $wxs = Get-Content crates/custos-cli/wix/main.wxs -Raw
          $wxs = $wxs -replace '(<Product\b[^>]*\bVersion=")[^"]*(")', ('${1}' + $ver + '${2}')
          Set-Content crates/custos-cli/wix/main.wxs $wxs
          cargo wix --package custos-cli --nocapture
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Path "target/wix/*.msi" -Destination dist/

      # macOS: dmg (ad-hoc signed .app) + binary tarball.
      - name: package dmg
        if: runner.os == 'macOS'
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          BINDIR="target/${{ matrix.target }}/release"
          mkdir -p "staging/Custos.app/Contents/MacOS" dist
          cp "$BINDIR/custos" "staging/Custos.app/Contents/MacOS/custos"
          cp "$BINDIR/custos-tray" "staging/Custos.app/Contents/MacOS/custos-tray"
          cat > "staging/Custos.app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Custos</string>
            <key>CFBundleIdentifier</key><string>io.custos.cli</string>
            <key>CFBundleExecutable</key><string>custos</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
          </dict></plist>
          EOF
          codesign --force --deep -s - "staging/Custos.app"
          hdiutil create -volname Custos -srcfolder staging -ov -format UDZO "dist/${{ matrix.artifact }}.dmg"
          tar -C "target/${{ matrix.target }}/release" -czf "dist/${{ matrix.artifact }}.tar.gz" custos custos-tray

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error

  # Rolling `nightly` prerelease: replaces the previous nightly artifacts.
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          prerelease: true
          name: nightly
          body: |
            Rolling nightly build. Unverified: binaries are gated on
            fmt + clippy + workspace tests but are NOT a formal release.
            No version tag is created.
          delete_assets: true
          files: dist/*
