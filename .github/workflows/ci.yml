# PR/push validation: fmt + clippy + workspace tests + mingw cross-check.
# Distinct from the nightly rolling build: this gates every merge, never
# publishes anything (version releases are user-triggered only).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # custos-python links -lpython3.x: the 26.04 runner image no longer
      # ships the dev headers the 24.04 image had.
      - name: install python dev headers
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-dev
      # rust-cache can carry pyo3 build outputs probed on the old 24.04 image
      # (python 3.12); the 26.04 image has a different interpreter and no
      # libpython3.12, so the link fails. Drop the stale probe outputs and
      # let pyo3 re-detect the interpreter of the current image.
      - name: refresh pyo3 build outputs
        run: cargo clean -p custos-python -p pyo3 -p pyo3-ffi
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace

  mingw:
    # The Windows (gnu) build is a supported target: keep it compiling.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: install mingw (bundled sqlite3 cross-compiles)
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - name: cross-check
        run: cargo check --workspace --target x86_64-pc-windows-gnu

  macos:
    # Real macOS leg (macos-15 arm64): runs the cfg(target_os = "macos")
    # paths — the launchd init-system controller, the tray logic — at run
    # level on Apple hardware. The sunlogin and network-adapter plugins are
    # excluded: their platform matrix is Windows+Linux and their not(windows)
    # branch shells out to systemctl/ss/ip, which do not exist on macOS
    # (their parsers are covered by the ubuntu leg on the same cfg branch).
    # Test-only: releases stay user-triggered; binaries roll via nightly.
    runs-on: macos-15
    # nextest's per-test timeout (from .config/nextest.toml) makes a hung
    # test report its name in ~2 minutes instead of stalling the job to the
    # cap (the opaque `cargo test` step stalled for 30+ min on the first
    # macos runs, unable to name the hanging crate from outside). Job
    # timeout bounds the same.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: build
        run: cargo build --workspace
      - name: test
        run: cargo nextest run --workspace --exclude custos-sunlogin-plugin --exclude custos-network-adapter-plugin

  freebsd:
    # Real FreeBSD leg (vmactions VM): runs the cfg(target_os = "freebsd")
    # paths — the rc.d init-system controller, the ifconfig adapters — at
    # run level on a FreeBSD guest. Scope is the platform crate: it is the
    # only one with FreeBSD-native code (the rest follow the Linux adapter
    # branch, which FreeBSD deliberately does not take). Test-only: releases
    # stay user-triggered; binaries roll via nightly.
    runs-on: ubuntu-latest
    # The vmactions VM boots FreeBSD from a qemu-style image over SSH; the
    # cap bounds a hung pkg/compile the same way it does the macos leg.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: pkg install -y -q rust
          run: cargo test -p custos-platform
