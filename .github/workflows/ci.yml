# PR/push validation: fmt + clippy + workspace tests + mingw cross-check.
# Distinct from the nightly rolling build: this gates every merge, never
# publishes anything (version releases are user-triggered only).
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace

  mingw:
    # The Windows (gnu) build is a supported target: keep it compiling.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install mingw (bundled sqlite3 cross-compiles)
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - name: cross-check
        run: cargo check --workspace --target x86_64-pc-windows-gnu
