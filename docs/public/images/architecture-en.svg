<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1400" viewBox="0 0 1280 1400" role="img" aria-labelledby="title desc" xml:lang="en-US">
<title id="title">Custos · System Architecture</title>
<desc id="desc">Custos system architecture: CLI, dashboard, tray and Python binding drive a core engine maintaining the resource registry and dependency graph; the recovery engine schedules, executes under policy and budget, and verifies health before declaring recovery; plugin capabilities come from external processes over JSON-RPC stdio; platform adapters carry out OS actions; events persist to the SQLite recovery store and feed the notification engine.</desc>
