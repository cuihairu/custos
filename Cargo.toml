[workspace]
resolver = "2"
members = [
    "crates/custos-model",
    "crates/custos-core",
    "crates/custos-engine",
    "crates/custos-probe",
    "crates/custos-plugin-api",
    "crates/custos-toolbox",
    "crates/custos-plugin-host",
    "crates/custos-platform",
    "crates/custos-config",
    "crates/custos-store",
    "crates/custos-notify",
    "crates/custos-python",
    "crates/custos-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
custos-model = { path = "crates/custos-model" }
custos-engine = { path = "crates/custos-engine" }
custos-store = { path = "crates/custos-store" }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
tokio = { version = "1", features = ["rt"] }
custos-config = { path = "crates/custos-config" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.9"
