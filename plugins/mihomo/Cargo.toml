[package]
name = "custos-mihomo-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true

# One plugin process, one resource loop (todo.md 217: the one-plugin-one-resource-loop rule).
[[bin]]
name = "mihomo-plugin"
path = "src/main.rs"

[dependencies]
custos-plugin-api = { path = "../../crates/custos-plugin-api" }
custos-probe = { path = "../../crates/custos-probe" }
clash-api = { path = "../clash-api" }
serde_json = { workspace = true }

[dev-dependencies]
custos-plugin-host = { path = "../../crates/custos-plugin-host" }
